name: APK derle
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/res/mipmap-xxhdpi app/src/main/res/drawable-xhdpi app/src/main/java/com/m3uplayer/tv
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "M3UPlayer"
          include ':app'
          EOF_0
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_2
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.m3uplayer.tv'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.m3uplayer.tv'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              lint { abortOnError false }
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="M3U Player"
                  android:icon="@mipmap/ic_launcher"
                  android:banner="@drawable/banner"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/m3uplayer/tv/MainActivity.java <<'EOF_5'
          package com.m3uplayer.tv;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;

              /** Sayfadaki "Evet, çık" düğmesi bunu çağırır. */
              public class Bridge {
                  @JavascriptInterface
                  public void exit() {
                      runOnUiThread(new Runnable() {
                          @Override public void run() { finishAffinity(); }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF000000);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  // Sayfa yerel dosyadan açılır; bu ayar sayesinde liste adresleri CORS'a takılmadan çekilir.
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  web.addJavascriptInterface(new Bridge(), "AndroidApp");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              /** Geri tuşu sayfaya iletilir; çıkış sorusunu sayfa gösterir. */
              @Override
              public void onBackPressed() {
                  web.evaluateJavascript(
                      "window.dispatchEvent(new KeyboardEvent('keydown',{key:'GoBack',bubbles:true,cancelable:true}))", null);
              }

              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              @Override protected void onResume() { super.onResume(); web.onResume(); hideBars(); }
              @Override protected void onPause() { web.onPause(); super.onPause(); }
              @Override protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          EOF_5
          cp index.html app/src/main/assets/index.html
      - name: Simgeleri olustur
        run: |
          pip install pillow -q
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          P='app/src/main/res/'
          def tile(w,h,text=None):
              im=Image.new('RGB',(w,h),(16,26,48));d=ImageDraw.Draw(im)
              s=min(w,h);cx,cy=(w//2 if not text else int(w*0.27)),h//2;r=int(s*0.30)
              d.ellipse([cx-r,cy-r,cx+r,cy+r],fill=(47,129,247))
              t=int(r*0.55);d.polygon([(cx-t*0.6,cy-t),(cx-t*0.6,cy+t),(cx+t,cy)],fill=(255,255,255))
              if text:
                  f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',int(h*0.22))
                  d.text((int(w*0.45),cy),text,font=f,fill=(255,255,255),anchor='lm')
              return im
          tile(192,192).save(P+'mipmap-xxhdpi/ic_launcher.png')
          tile(320,180,'M3U Player').save(P+'drawable-xhdpi/banner.png')
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Player-apk
          path: app/build/outputs/apk/debug/*.apk
