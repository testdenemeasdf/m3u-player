<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-visual">
<title>M3U Player</title>
<style>
*{box-sizing:border-box;margin:0}
html{font-size:calc(clamp(14px,1.6vw,34px)*var(--z,1))}
html,body{height:100%;background:#000;color:#f2f5f8;font-family:system-ui,Roboto,sans-serif;overflow:hidden}
body{font-size:1rem}
video{position:fixed;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
/* Kanal listesi: TV'deki gibi ekranın solunda açılan kart */
#panel{position:fixed;left:4vw;top:3vh;bottom:3vh;width:clamp(380px,40vw,780px);padding:.7rem .8rem .5rem;background:rgba(10,16,32,.93);border:.1rem solid #2b3a5c;border-radius:1rem;box-shadow:0 1rem 3rem #000b;display:flex;flex-direction:column;gap:.4rem;transition:transform .2s,opacity .2s}
#panel.hide{transform:translateX(-6vw);opacity:0;pointer-events:none}
#q{width:100%;padding:.3rem .8rem;font:inherit;font-size:.85rem;background:#0b1222;color:inherit;border:.12rem solid #2b3a5c;border-radius:.7rem}
#q:focus{border-color:#4da3ff;box-shadow:0 0 0 .18rem #4da3ff66;outline:0}
#g{display:flex;align-items:center;gap:.5rem;background:#0b1222;border-radius:.7rem;padding:.2rem}
#gl{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-weight:700;color:#8cc4ff}
button{font:inherit;color:inherit;background:#18233b;border:.1rem solid #2b3a5c;border-radius:.7rem;padding:.35rem .9rem;cursor:pointer}
button:focus,#g:focus{outline:0;background:var(--ac);border-color:#fff;box-shadow:0 0 0 .18rem #fff8}
#g:focus #gl{color:#fff}
#bar{display:flex;gap:.5rem;align-items:center}
#st{font-size:.7rem;color:#9db3d6;flex:1;text-align:right}
#list{flex:1;overflow-y:auto;position:relative;outline:0;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
#sp{position:relative}
.row{position:absolute;left:0;right:0;top:0;height:var(--rh);display:flex;align-items:center;gap:.6rem;padding:0 .7rem;font-size:.85rem;border-radius:.5rem;cursor:pointer;will-change:transform}
.row .i{width:3.2ch;text-align:right;font-size:.75rem;color:#7f93b8;flex:none}
.row .n{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.row.cur .n::before{content:"▶ ";color:#3ddc84;font-size:.8em}
.row.cur .n{color:#3ddc84}
.row.sel{background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 0 .12rem #fff;z-index:2}
.row.sel .n,.row.sel .i,.row.sel .n::before{color:#fff}
#hint{display:flex;gap:1.1rem;font-size:.65rem;color:#9db3d6;padding-top:.4rem;border-top:.08rem solid #22304d;white-space:nowrap;overflow:hidden}
#hint b{color:#fff}
/* Kanal bilgi çubuğu: kanal değişince altta çıkar */
#now{z-index:10;position:fixed;left:3vw;right:3vw;bottom:5vh;display:flex;align-items:center;gap:1.4rem;padding:.9rem 1.6rem;border-radius:1rem;background:linear-gradient(90deg,rgba(8,20,48,.94),rgba(8,12,24,.9));border:.08rem solid #2b3a5c;opacity:0;transform:translateY(1.5rem);transition:.3s;pointer-events:none}
#now.on{opacity:1;transform:none}
#panel:not(.hide)~#now:not(.num){opacity:0;visibility:hidden}
#nn{min-width:3.6ch;padding:.3rem .9rem;background:var(--ac);border-radius:.6rem;font-size:1.8rem;font-weight:800;text-align:center}
#nt{flex:1;min-width:0}
#nt small{display:block;font-size:.75rem;color:#9db3d6;text-transform:uppercase;letter-spacing:.06em}
#nm{margin-top:.2rem;text-transform:none!important;letter-spacing:0!important;color:#8cc4ff!important}
#nt b{display:block;font-size:1.6rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#nc{text-align:right;white-space:pre-line;font-size:.8rem;color:#b8c7e0;line-height:1.35}
#nc::first-line{font-size:1.5rem;font-weight:700;color:#fff}
#toast{z-index:11;position:fixed;top:5vh;right:4vw;max-width:60vw;background:rgba(8,12,24,.9);border:.08rem solid #2b3a5c;padding:.5rem 1.1rem;border-radius:.7rem;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
#spin{position:fixed;left:50%;top:50%;width:3rem;height:3rem;margin:-1.5rem;border:.3rem solid #ffffff33;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;display:none}
#spin.on{display:block}@keyframes r{to{transform:rotate(360deg)}}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center}
#dlg.on{display:flex}
#dlg>div{background:#101a30;border:.1rem solid #2b3a5c;padding:1.4rem;border-radius:1rem;width:min(40rem,90vw);display:flex;flex-direction:column;gap:.8rem}
textarea{width:100%;height:8rem;resize:none;padding:.6rem .9rem;font:inherit;background:#0b1222;color:inherit;border:.12rem solid #2b3a5c;border-radius:.7rem}
textarea:focus{border-color:#4da3ff;outline:0}
#dlg small{color:#9db3d6;font-size:.7rem}
.row.mv{background:linear-gradient(90deg,#d29922,#9e6a03);box-shadow:0 0 0 .12rem #fff}
.row.mv .n::after{content:"  ⇅";}
#mnu{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
#mnu.on{display:flex}
#mnu>div{background:#101a30;border:.1rem solid #2b3a5c;border-radius:1rem;padding:1rem;width:min(30rem,88vw)}
#mT{display:block;margin-bottom:.6rem;color:#9db3d6;font-size:.8rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mi{padding:.55rem .9rem;border-radius:.6rem;cursor:pointer}
.mi.on{background:var(--ac);color:#fff}
#toast{z-index:25}
#dlg{z-index:16}
#wel{position:fixed;inset:0;z-index:15;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;padding:4vh 4vw;background:radial-gradient(ellipse at top,#16254a,#050810 70%)}
#wel.on{display:flex}
#wel h1{font-size:2.6rem;font-weight:800}
#wel p{color:#9db3d6;font-size:.85rem;text-align:center}
#wl{width:min(34rem,92vw);max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:.4rem;scrollbar-width:none}
#wl::-webkit-scrollbar{display:none}
#wl button{text-align:left;padding:.7rem 1.1rem;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#wl button.alt{background:transparent;color:#9db3d6}
#wl button.alt:focus{background:var(--ac);color:#fff}
:root{--ac:#2f81f7;--ac2:#1c5fd1}
.row .lg{width:2rem;height:2rem;object-fit:contain;flex:none;border-radius:.3rem}
#nl{display:none;height:3rem;max-width:6rem;object-fit:contain;border-radius:.4rem}
#nr{display:none;flex-direction:column;align-items:center;padding:.3rem .8rem;border:.1rem solid #3a4d78;border-radius:.6rem;background:#0b1222;font-size:.8rem;color:#b8c7e0;line-height:1.25;white-space:nowrap}
#nr b{font-size:1.4rem;font-weight:800;color:#fff}
#nr.on{display:flex}
.sb{position:fixed;top:50%;transform:translateY(-50%);z-index:9;width:3.4rem;height:6.5rem;padding:0;font-size:2.6rem;line-height:1;border-radius:1rem;background:rgba(10,16,32,.72);border-color:#2b3a5c;opacity:0;pointer-events:none;transition:opacity .25s}
#pv{left:.8vw}#nx{right:.8vw}
body.ui .sb{opacity:1;pointer-events:auto}
#panel:not(.hide)~.sb{display:none}
#bar{gap:.4rem}
#bar button{font-size:.72rem;padding:.28rem .6rem;border-radius:.5rem;white-space:nowrap;flex:none}
#gp,#gn{font-size:.75rem;padding:.15rem .6rem;border-radius:.5rem}
#gl{font-size:.85rem}
#st{font-size:.65rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint{font-size:.6rem;gap:.9rem;padding-top:.3rem}
</style></head><body>
<video id="v" autoplay playsinline></video>
<div id="panel" class="hide">
 <div id="top">
  <input id="q" type="search" placeholder="🔍  Kanal ara…" autocomplete="off">
  <div id="g" tabindex="0"><button id="gp" tabindex="-1">◀</button><span id="gl"></span><button id="gn" tabindex="-1">▶</button></div>
  <div id="bar"><button id="bOpen">Kanal düzenle</button><button id="bSet">Ayarlar ⚙</button><button id="bUrl">Liste seç</button><span id="st"></span></div>
 </div>
 <div id="list" tabindex="-1"><div id="sp"></div></div>
 <div id="hint"><span><b>OK</b> İzle</span><span><b>OK basılı</b> Kanal düzenle</span><span><b>◀▶</b> Grup</span><span><b>Geri</b> Paneli kapat</span></div>
</div>
<div id="now"><div id="nn"></div><img id="nl" alt=""><div id="nr"></div><div id="nt"><small></small><b></b><small id="nm"></small></div><div id="nc"></div></div><div id="spin"></div>
<div id="toast"></div>
<button id="pv" class="sb" tabindex="-1" aria-label="Önceki kanal">‹</button><button id="nx" class="sb" tabindex="-1" aria-label="Sonraki kanal">›</button>
<div id="wel"><h1>👋 Hoş geldiniz</h1><p id="wp">Listeler aranıyor…</p><div id="wl"></div><p style="font-size:.7rem">▲▼ Seç · OK Aç</p></div>
<div id="dlg"><div>
 <b id="dT">M3U listesi yükle</b>
 <textarea id="ta" placeholder="http://… liste adresi  veya  #EXTM3U içeriğini yapıştırın"></textarea>
 <small id="dS">Adres CORS'a izin vermiyorsa içeriği yapıştırın.</small>
 <div style="display:flex;gap:8px"><button id="dOk">Yükle</button><button id="dNo">İptal</button></div>
</div></div>
<div id="mnu"><div><b id="mT"></b><div id="mL"></div></div></div>
<input id="fi" type="file" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<input id="fj" type="file" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0">
<script>
const $=s=>document.querySelector(s);
const v=$('#v'),panel=$('#panel'),list=$('#list'),sp=$('#sp'),q=$('#q'),gl=$('#gl'),st=$('#st'),toastEl=$('#toast'),dlg=$('#dlg'),ta=$('#ta'),fi=$('#fi');
const HLS='https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js';
const MPEGTS='https://cdnjs.cloudflare.com/ajax/libs/mpegts.js/1.7.3/mpegts.min.js';
let RH=56;function setRH(){RH=Math.round(parseFloat(getComputedStyle(document.documentElement).fontSize)*2.1);document.documentElement.style.setProperty("--rh",RH+"px")}setRH();addEventListener("resize",()=>{setRH();flush()});
let N=[],U=[],G=[],L=[],T=[],GN=[],gmap=new Map(),view=null,filtered=false,gsel=-1,qs='',sel=0,playing=-1,gen=0,loading=false;
const DEF=()=>({fav:[],hid:[],ren:{},grp:{},ops:[],lnk:{},bak:{},rec:[],cnt:{},fails:{},dead:[],asp:{},pref:{},pin:'',lockg:[],hidg:[],grn:{},sched:[],ng:[]});
let E;try{E=JSON.parse(localStorage.getItem('edits')||'')}catch(e){}
E=Object.assign(DEF(),E||{});
let favSet=new Set(E.fav),hidS=new Set(E.hid),recSet=new Set(E.rec),deadS=new Set(E.dead),noDiff=false;
let moving=false,okDown=false,okLong=false,okLast=0,okTimer=0,menuOpenT=0,menuItems=[],mi=0,editEi=-1,dlgMode='url',curSrc;
function save(){favSet=new Set(E.fav);hidS=new Set(E.hid);recSet=new Set(E.rec);deadS=new Set(E.dead);try{localStorage.setItem('edits',JSON.stringify(E))}catch(e){toast('Düzenleme kaydedilemedi')}}
function gid(g){g=g||'Diğer';let i=gmap.get(g);if(i===undefined){i=GN.length;GN.push(g);gmap.set(g,i)}return i}
const pool=[];let toastT,nowT;
const nowEl=$('#now'),spin=$('#spin');
const nS=nowEl.querySelector('small'),nB=nowEl.querySelector('b'),nN=$('#nn'),nC=$('#nc'),nM=$('#nm');
let curHost='';
function hostOf(u){try{return new URL(u).hostname}catch(e){return ''}}
function resTag(){const h=v.videoHeight,w=v.videoWidth;if(!w||!h)return '';return w+'×'+h+' '+(h>=2000?'4K':h>=1000?'FHD':h>=700?'HD':'SD')}
const nR=$('#nr');
function updMeta(){if(playing<0)return;const bw=(typeof hls!=='undefined'&&hls&&hls.bandwidthEstimate)?(hls.bandwidthEstimate/1e6).toFixed(1)+' Mbps':'';const rt=resTag();if(rt){const pr=rt.split(' ');nR.innerHTML='<b></b><span></span>';nR.firstChild.textContent=pr[1]||'';nR.lastChild.textContent=pr[0];nR.classList.add('on')}else nR.classList.remove('on');nM.textContent=[curHost,bw,stalls?'takılma '+stalls:''].filter(Boolean).join('  ·  ')}
['loadedmetadata','loadeddata','canplay','resize','playing'].forEach(n=>v.addEventListener(n,updMeta));
function clock(){const d=new Date();return d.toLocaleTimeString('tr',{hour:'2-digit',minute:'2-digit'})+'\n'+d.toLocaleDateString('tr',{weekday:'long',day:'numeric',month:'long'})}
function showNow(ei){curHost=hostOf(U[ei]);nR.classList.remove('on');nN.textContent=filtered?sel+1:ei+1;nS.textContent=(GN[G[ei]]||'')+epgText(ei);nB.textContent=N[ei];const lg=L[ei];nl.style.display=lg?'block':'none';if(lg)nl.src=lg;nC.textContent=clock();updMeta();nowEl.classList.remove('num');nowEl.classList.add('on');clearTimeout(nowT);nowT=setTimeout(()=>nowEl.classList.remove('on'),6000)}
const vlen=()=>filtered?view.length:N.length;
const get=i=>filtered?view[i]:i;
function toast(t){toastEl.textContent=t;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),3000)}

/* ---------- IndexedDB önbellek (tekrar açılışta anında yükleme) ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('m3u',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(k,val){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(val,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

/* ---------- Sanal liste: sadece görünen ~20 satır DOM'da ---------- */
function render(){
 const n=vlen();sp.style.height=n*RH+'px';
 const t=list.scrollTop,h=list.clientHeight||600;
 const s=Math.max(0,Math.floor(t/RH)-2),e=Math.min(n,Math.ceil((t+h)/RH)+2),need=Math.max(0,e-s);
 while(pool.length<need){const d=document.createElement('div');d.innerHTML='<span class="i"></span><span class="n"></span>';d.i=d.children[0];d.n=d.children[1];sp.appendChild(d);pool.push(d)}
 for(let i=0;i<pool.length;i++){
  const d=pool[i],idx=s+i;
  if(i>=need){d.style.display='none';continue}
  const ei=get(idx);
  d.style.display='';d.style.transform='translateY('+idx*RH+'px)';d.dataset.i=idx;
  d.i.textContent=idx+1;d.n.textContent=(deadS.has(U[ei])?'✖ ':'')+(favSet.has(U[ei])?'★ ':'')+N[ei];
  d.className='row'+(idx===sel?' sel':'')+(ei===playing?' cur':'')+(moving&&idx===sel?' mv':'');
 }
}
let fl=0;
function flush(){if(fl)return;fl=requestAnimationFrame(()=>{fl=0;
 gl.textContent=gsel===-2?'★ Favoriler':gsel===-3?'🕘 Son izlenenler':gsel<0?'Tüm kanallar':GN[gsel];
 st.textContent=vlen().toLocaleString('tr')+(filtered?' / '+N.length.toLocaleString('tr'):'')+' kanal'+(loading?' · yükleniyor…':'');
 render()})}
let sr=0;list.addEventListener('scroll',()=>{if(!sr)sr=requestAnimationFrame(()=>{sr=0;render()})},{passive:true});
function reveal(){const t=list.scrollTop,h=list.clientHeight;if(sel*RH<t)list.scrollTop=sel*RH;else if((sel+1)*RH>t+h)list.scrollTop=(sel+1)*RH-h}

/* ---------- Filtre ---------- */
function ok(i){if(gsel>=0&&G[i]!==gsel)return false;if(gsel===-2&&!favSet.has(U[i]))return false;if(gsel===-3&&!recSet.has(U[i]))return false;return !qs||N[i].toLowerCase().indexOf(qs)>=0}
function matchAdd(a,b){if(!filtered)return;for(let i=a;i<b;i++)if(ok(i))view.push(i)}
function applyFilter(){qs=q.value.trim().toLowerCase();filtered=!!qs||gsel!==-1;
 if(gsel<=-2){view=[];const idx=new Map(),ss=gsel===-2?favSet:recSet;for(let i=0;i<U.length;i++)if(ss.has(U[i]))idx.set(U[i],i);for(const u of (gsel===-2?E.fav:E.rec)){const i=idx.get(u);if(i!==undefined&&(!qs||N[i].toLowerCase().indexOf(qs)>=0))view.push(i)}}
 else if(filtered){view=[];matchAdd(0,N.length)}else view=null;
 sel=0;list.scrollTop=0;flush()}
function cycleGroup(d){const o=[-1];if(E.fav.length)o.push(-2);if(E.rec.length)o.push(-3);for(let i=0;i<GN.length;i++)o.push(i);if(o.length<2)return;let k=o.indexOf(gsel);if(k<0)k=0;gsel=o[(k+d+o.length)%o.length];applyFilter()}
let qt;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(applyFilter,150)});
$('#gp').onclick=()=>cycleGroup(-1);$('#gn').onclick=()=>cycleGroup(1);gl.onclick=()=>cycleGroup(1);

/* ---------- Akış (streaming) ayrıştırıcı: ilk kanallar saniyeler değil milisaniyeler içinde görünür ---------- */
function attr(l,k){const a=l.indexOf(k+'="');if(a<0)return'';const b=a+k.length+2,e=l.indexOf('"',b);return l.slice(b,e<0?undefined:e)}
function parser(hook){
 let carry='',name='',grp='',logo='',tid='',bom=true;
 function line(l){
  l=l.trim();if(!l)return;
  if(l.charCodeAt(0)===35){
   if(l.startsWith('#EXTINF')){
    const a=l.indexOf('group-title="');grp='';
    if(a>=0){const s=a+13,e=l.indexOf('"',s);grp=l.slice(s,e<0?undefined:e)}
    logo=attr(l,'tvg-logo');tid=attr(l,'tvg-id');
    const qd=l.lastIndexOf('"'),c=l.indexOf(',',qd>0?qd:0);
    name=c>=0?l.slice(c+1).trim():'';
   }else if(l.startsWith('#EXTGRP:'))grp=l.slice(8).trim();
   return;
  }
  const u=E.lnk[l]||l;
  if(hidS.size&&hidS.has(u)){name='';grp='';logo='';tid='';return}
  let nm=name||u,gg=grp;const r1=E.ren[u];if(r1)nm=r1;const g1=E.grp[u];if(g1)gg=g1;gg=E.grn[gg]||gg;if(E.hidg.includes(gg||'Diğer')){name='';grp='';logo='';tid='';return}
  N.push(nm);U.push(u);G.push(gid(gg));L.push(logo);T.push(tid);name='';grp='';logo='';tid='';if(hook)hook(N.length-1,u);
 }
 return{feed(s,final){
  if(bom){s=s.replace(/^\uFEFF/,'');bom=false}
  const from=N.length,t=carry?carry+s:s;let pos=0,nl;
  while((nl=t.indexOf('\n',pos))>=0){line(t.slice(pos,nl));pos=nl+1}
  carry=t.slice(pos);
  if(final&&carry){line(carry);carry=''}
  matchAdd(from,N.length);
 }};
}
function reset(){N=[];U=[];G=[];L=[];T=[];GN=[];gmap=new Map();view=null;filtered=false;gsel=-1;qs='';q.value='';sel=0;playing=-1;list.scrollTop=0}
function blobStream(b){let o=0;const C=1<<20;return new ReadableStream({pull(c){if(o>=b.size){c.close();return}return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{c.enqueue(new Uint8Array(fr.result));o+=C;res()};fr.onerror=()=>rej(fr.error);fr.readAsArrayBuffer(b.slice(o,o+C))})}})}
async function load(src,cache=true){
 const my=++gen;reset();loading=true;flush();let started=false;curSrc=src;
 try{
  let stream,txt=null;
  if(typeof src==='string'){
   const r=await fetch(src,{cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);
   stream=r.body;
   if(!stream)txt=await r.text();
   else if(cache){const [a,b]=stream.tee();stream=a;new Response(b).blob().then(bl=>idbSet('last',bl)).catch(()=>{})}
  }else{if(cache)idbSet('last',src).catch(()=>{});if(src.stream)stream=src.stream();else if(typeof ReadableStream!=='undefined')stream=blobStream(src);else txt=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsText(src)})}
  const last=localStorage.getItem('lastUrl');
  const hook=(i,url)=>{if(started)return;if(!last||url===last){started=true;sel=i;play(i)}};
  const p=parser(hook);
  if(txt!==null)p.feed(txt,true);
  else{
   const rd=stream.getReader(),dec=new TextDecoder();let lt=performance.now();
   for(;;){
    const{done,value}=await rd.read();
    if(my!==gen){rd.cancel();return}
    if(done)break;
    p.feed(dec.decode(value,{stream:true}),false);
    if(performance.now()-lt>60){flush();await new Promise(r=>setTimeout(r));lt=performance.now();if(my!==gen){rd.cancel();return}}
   }
   p.feed(dec.decode(),true);
  }
 }catch(err){if(my===gen)toast('Liste açılamadı: '+err.message+(typeof src==='string'?' (CORS olabilir; dosya/yapıştır deneyin)':''))}

function stepCh(d){const n=vlen();if(!n)return;let c=playing>=0?(filtered?view.indexOf(playing):playing):-1;if(c<0)c=sel;sel=(c+d+n)%n;play(get(sel));poke()}
let uiT;function poke(){document.body.classList.add('ui');clearTimeout(uiT);uiT=setTimeout(()=>document.body.classList.remove('ui'),4000)}
['mousemove','pointerdown','touchstart'].forEach(n=>addEventListener(n,poke,{passive:true}));
$('#pv').onclick=e=>{e.currentTarget.blur();stepCh(-1)};$('#nx').onclick=e=>{e.currentTarget.blur();stepCh(1)};
applyUI();loadEPG();

/* ---------- Hoş geldiniz ekranı: her açılışta liste seçtirir ---------- */
const wel=$('#wel'),wl=$('#wl'),wp=$('#wp');let welGen=0;
const welIsOn=()=>wel.classList.contains('on');
function hideWel(){wel.classList.remove('on');blurAll()}
function welBtn(t,f,alt){const b=document.createElement('button');b.textContent=t;if(alt)b.className='alt';b.onclick=()=>{f()};wl.appendChild(b);return b}
function useSrc(src,key){hideWel();if(key)try{localStorage.setItem('listFile',key)}catch(e){}load(src)}
async function showPicker(){
 const my=++welGen;wel.classList.remove('intro');wel.classList.add('on');hidePanel();blurAll();wl.innerHTML='';wp.textContent='Listeler aranıyor…';
 const fs=await discover();if(my!==welGen||!welIsOn())return;
 const last=localStorage.getItem('listFile'),qu=new URLSearchParams(location.search).get('url');let first=null;
 wl.innerHTML='';
 fs.forEach(f=>{const b=welBtn('📄 '+f.name,()=>useSrc(f.href,f.href));if(f.href===last)first=b});
 if(qu)welBtn('🔗 '+(hostOf(qu)||qu),()=>useSrc(qu));
 if(!fs.length){try{const c=await idbGet('last');if(my!==welGen)return;if(c)welBtn('💾 Son açılan liste (önbellek)',()=>{hideWel();load(c,false)})}catch(e){}}
 if(fs.length>1)welBtn('🔀 Tüm listeleri birleştir ('+fs.length+')',()=>{hideWel();loadMany(fs.map(f=>f.href))});
 welBtn('📂 Dosyadan seç…',()=>fi.click(),1);
 welBtn('🔗 URL / Yapıştır…',()=>openDlg('url'),1);
 wp.textContent=fs.length?fs.length+' liste bulundu — birini seçin':(location.protocol==='file:'?'Sayfa dosya olarak açıldı: listeleri bulmak için sunucudan açın ya da dosya seçin':'Bu dizinde liste bulunamadı');
 (first||wl.firstChild).focus()}

/* ---------- Başlangıç ---------- */
async function startTV(){
 const qu=new URLSearchParams(location.search).get('url'),last=localStorage.getItem('listFile');
 if(qu){useSrc(qu);return}
 if(last){hideWel();load(last);return}
 let c=null;try{c=await idbGet('last')}catch(e){}
 if(c){hideWel();load(c,false);return}
 const fs=await discover();
 if(fs.length===1){useSrc(fs[0].href,fs[0].href);return}
 showPicker()}
startTV();
</script></body></html>
